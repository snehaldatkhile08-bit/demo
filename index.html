@'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Registration</h1>
        <p>Welcome! Enter your details below.</p>

        <form id="studentForm">
            <input type="text" id="name" placeholder="Student Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="text" id="course" placeholder="Course Name" required>
            <button type="submit">Register</button>
        </form>

        <p id="message"></p>
    </div>

    <script>
        document.getElementById("studentForm").addEventListener("submit", function(event) {
            event.preventDefault();
            const name = document.getElementById("name").value;
            document.getElementById("message").textContent =
                "Thank you, " + name + "! Demo registration successful.";
        });
    </script>
</body>
</html>
'@ | Set-Content -Encoding utf8 index.html
